<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock TSSA Console</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">TS</span><div><b>Mock TSSA</b><small id="ver">TrueSight Server Automation emulator</small></div></div>
  <div class="top-right"><span id="clock"></span><span class="pill" id="sessPill">BLAdmin · BLAdmins</span></div>
</header>
<div class="shell">
  <nav class="side" id="nav">
    <a data-page="dashboard" class="active">Dashboard</a>
    <a data-page="servers">Servers</a>
    <a data-page="depot">Depot</a>
    <a data-page="catalogs">Patch Catalogs</a>
    <a data-page="jobs">Jobs</a>
    <a data-page="runs">Job Runs <span class="badge" id="runningBadge" hidden>0</span></a>
    <a data-page="inspector">API Inspector <span class="badge warn" id="unmatchedBadge" hidden>0</span></a>
    <a data-page="callbacks">Callbacks <span class="badge warn" id="cbBadge" hidden>0</span></a>
    <a data-page="autosync">HAC Auto-Sync</a>
    <a data-page="settings">Settings</a>
  </nav>
  <main id="main"></main>
</div>
<div class="drawer" id="drawer" hidden>
  <div class="drawer-head"><h2 id="drawerTitle"></h2><button class="btn ghost" id="drawerClose">Close</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
